<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loan Collection Management System (LCMS)</title>
    <meta name="description" content="Comprehensive Loan Collection Management System with Admin Panel, Collection Boy Panel, and Customer Portal." />
    <script>
      // Ensure trailing slash on GitHub Pages so relative paths './assets/...' resolve properly
      if (
        window.location.hostname.endsWith('github.io') &&
        window.location.pathname.length > 1 &&
        !window.location.pathname.endsWith('/') &&
        !window.location.pathname.includes('.')
      ) {
        window.history.replaceState(null, '', window.location.pathname + '/' + window.location.search + window.location.hash);
      }

      // Safeguard for iframe sandboxes where window.fetch has only a getter
      try {
        if (typeof window !== 'undefined') {
          let _activeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get() {
              return _activeFetch;
            },
            set(fn) {
              _activeFetch = fn;
            },
            configurable: true,
            enumerable: true,
          });
        }
      } catch (e) {
        // Safe fallback
      }

      // Global error logger for initial bootstrap
      window.addEventListener('error', function(e) {
        var msg = e && e.message ? e.message : 'Script failed to load';
        var errorBox = document.getElementById('lcms-bootstrap-error');
        if (errorBox) {
          errorBox.style.display = 'block';
          errorBox.innerText = 'Bootstrap Notice: ' + msg;
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif;">
        <div style="text-align: center; max-width: 440px; padding: 24px;">
          <div style="width: 44px; height: 44px; border: 3px solid rgba(59, 130, 246, 0.2); border-top-color: #3b82f6; border-radius: 50%; margin: 0 auto 16px auto; animation: spin 0.9s linear infinite;"></div>
          <h2 style="font-size: 18px; font-weight: 600; margin: 0 0 8px 0; letter-spacing: -0.01em;">Loading LCMS Application...</h2>
          <p style="font-size: 13px; color: #94a3b8; margin: 0 0 16px 0;">Initializing system database & modules</p>
          <div id="lcms-bootstrap-error" style="display: none; font-size: 12px; color: #f87171; background-color: #1e293b; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; margin-top: 12px; text-align: left; font-family: monospace;"></div>
        </div>
      </div>
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
